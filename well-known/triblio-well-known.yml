source: >-
  Direct HTTP probes of every host in apis.yml plus the live successor hosts
  discovered during this pass (foundryco.com, intent.foundryco.com,
  learning.foundryco.com / triblio.zendesk.com).
name: Triblio — .well-known probe
slug: triblio

summary: >-
  No /.well-known document of any kind is served for Triblio. The company's own
  domain no longer resolves at all — triblio.com is still registered to
  MarkMonitor and delegated to four Route 53 nameservers, but those nameservers
  answer REFUSED, meaning the hosted zone has been deleted. Every triblio.com
  host (apex, www, app, api, learning) therefore fails DNS resolution rather
  than returning a status code. On the surviving successor hosts, foundryco.com
  returns a WordPress 404 HTML page for every well-known path, the Foundry
  Intent application load balancer returns 503 on every path, and the Zendesk
  knowledge base sits behind a Cloudflare bot challenge. NO WellKnown or
  SecurityTxt pointer is emitted: this file documents an absence, not a
  presence.

hosts_probed:
  - host: www.triblio.com
    resolves: false
    note: >-
      NXDOMAIN / no A record. Route 53 hosted zone deleted — the delegated
      nameservers (ns-246.awsdns-30.com and siblings) answer REFUSED for the
      zone.
  - host: triblio.com
    resolves: false
    note: Same as www — no A record, zone deleted.
  - host: app.triblio.com
    resolves: false
    note: Former Triblio application login host (app.triblio.com/login). Gone.
  - host: api.triblio.com
    resolves: false
    note: Probed on the chance an API host existed. Never resolved; no Wayback record.
  - host: learning.triblio.com
    resolves: false
    note: >-
      Former knowledge base host. Still cited by live third-party pages and by
      Foundry's own product page, but no longer resolves.
  - host: foundryco.com
    resolves: true
    note: Parent brand site (Cloudflare + WordPress). Serves an HTML 404 for every well-known path.
  - host: intent.foundryco.com
    resolves: true
    note: >-
      Foundry Intent application (AWS ELB intent-web-1606417831.us-east-1.elb.amazonaws.com).
      Returns awselb/2.0 503 on every path including /login — no healthy targets.
  - host: learning.foundryco.com
    resolves: true
    note: >-
      The migrated knowledge base. CNAMEs to triblio.zendesk.com — the Zendesk
      instance is still literally named "triblio", which is what confirms it is
      Triblio's own surface. Cloudflare answers 403 "error code: 1034" /
      "Just a moment..." to every request, including the anonymous Zendesk Help
      Center API.

