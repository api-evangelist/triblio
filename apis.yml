x-ownership-note: >-
  Foundry's developer portal at https://foundryco.com/developers/ documents the
  KickFire APIs only — base https://api.kickfire.com, endpoints for company,
  domain2ip, ip2geo, ip2country, logo and name2website. KickFire is a separate
  Foundry acquisition, not the Triblio ABM platform, and its contract is
  deliberately NOT recorded against this profile. Triblio itself consumed third-
  party APIs (Salesforce REST, Marketo REST, SugarCRM OAuth, G2 intent keys via
  the platform's Setup > "Web Sites & API" tab) and never published one.
